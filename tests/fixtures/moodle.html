<div id="page-mod-quiz-attempt">
  <!-- Question 1: Standard Moodle 4.x Boost theme multiple choice with answernumber and flex-fill and clearchoice -->
  <div class="que multichoice clearfix notyetanswered" id="q1">
    <div class="info">
      <h3 class="no">Question <span class="qno">1</span></h3>
      <div class="status">Not yet answered</div>
    </div>
    <div class="content">
      <div class="formulation clearfix">
        <h4 class="accesshide">Question text</h4>
        <div class="qtext">
          <p>Which language runs in a web browser?</p>
        </div>
        <fieldset class="ablock no-overflow">
          <legend class="prompt items-center">Select one:</legend>
          <div class="answer">
            <div class="r0">
              <input type="radio" name="q1:1_answer" value="0" id="q1:1_answer0">
              <label for="q1:1_answer0" class="d-flex w-100">
                <span class="answernumber">a. </span>
                <div class="flex-fill"><p>Python</p></div>
              </label>
            </div>
            <div class="r1">
              <input type="radio" name="q1:1_answer" value="1" id="q1:1_answer1">
              <label for="q1:1_answer1" class="d-flex w-100">
                <span class="answernumber">b. </span>
                <div class="flex-fill"><p>JavaScript</p></div>
              </label>
            </div>
            <div class="r0 clearchoice">
              <input type="radio" name="q1:1_answer" value="-1" id="q1:1_answer-1">
              <label for="q1:1_answer-1">Clear my choice</label>
            </div>
          </div>
        </fieldset>
      </div>
    </div>
  </div>

  <!-- Question 2: Table-based Moodle question -->
  <div class="que multichoice" id="q2">
    <div class="qtext"><p>What is the capital of France?</p></div>
    <div class="answer">
      <table class="answer">
        <tbody>
          <tr class="r0">
            <td class="control"><input type="radio" name="q2:1_answer" value="0" id="q2:1_answer0"></td>
            <td class="c0 text"><label for="q2:1_answer0"><span class="answernumber">a. </span>Berlin</label></td>
          </tr>
          <tr class="r1">
            <td class="control"><input type="radio" name="q2:1_answer" value="1" id="q2:1_answer1"></td>
            <td class="c1 text"><label for="q2:1_answer1"><span class="answernumber">b. </span>Paris</label></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Question 3: Checkbox multiple select -->
  <div class="que multichoice" id="q3">
    <div class="qtext"><p>Select all prime numbers:</p></div>
    <div class="answer">
      <div class="r0">
        <input type="checkbox" name="q3_c0" value="1" id="q3_c0">
        <label for="q3_c0"><span class="answernumber">a. </span>2</label>
      </div>
      <div class="r1">
        <input type="checkbox" name="q3_c1" value="1" id="q3_c1">
        <label for="q3_c1"><span class="answernumber">b. </span>4</label>
      </div>
      <div class="r0">
        <input type="checkbox" name="q3_c2" value="1" id="q3_c2">
        <label for="q3_c2"><span class="answernumber">c. </span>5</label>
      </div>
    </div>
  </div>
</div>
