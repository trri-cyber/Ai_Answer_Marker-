<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="dashboard.css"><title>AutoQuiz AI Database</title></head><body><main><h1>AutoQuiz AI · Answer Database</h1><p>Manage locally stored answers. Only verified entries are used as trusted matches.</p><section class="panel"><h2>Add answer</h2><input id="question" placeholder="Question text"><select id="type"><option value="unknown">Unknown</option><option value="multiple_choice">Multiple choice</option><option value="true_false">True / False</option><option value="short_answer">Short answer</option><option value="numerical">Numerical</option></select><textarea id="answer" placeholder="Answer"></textarea><textarea id="explanation" placeholder="Explanation (optional)"></textarea><label><input type="checkbox" id="verified"> I have independently verified this answer</label><button id="add">Save answer</button></section><section class="panel"><div class="row"><h2>Saved answers</h2><button id="export">Export JSON</button><label class="button">Import JSON<input type="file" id="import" accept=".json,application/json" hidden></label></div><div id="records"></div></section></main><script src="../database/localDatabase.js"></script><script src="dashboard.js"></script></body></html>
